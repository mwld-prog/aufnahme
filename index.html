<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#CF1219">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}</style>
</head><body>
<title>EAD Aufnahmeprotokoll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<style>
/* Layout: sticky app bar + section chips, one column of form sections, fixed action bar at the bottom */
:root{
  --bg:#F2F3F5; --surface:#FFFFFF; --sunken:#F7F8FA; --ink:#1A1C21; --muted:#5D626C;
  --line:#D9DCE2; --line-strong:#B9BEC8; --accent:#CF1219; --accent-hover:#B00F15;
  --accent-ink:#FFFFFF; --accent-soft:#FCEBEC; --ok:#1E7A4C; --ok-soft:#E5F3EC; --warn:#9A5B00;
  --shadow:0 1px 2px rgba(26,28,33,.06),0 4px 16px rgba(26,28,33,.05);
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-head:"Barlow Semi Condensed","Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111317; --surface:#1A1D23; --sunken:#15181D; --ink:#ECEDF0; --muted:#A2A7B1;
  --line:#2D323B; --line-strong:#454B57; --accent:#FF4D52; --accent-hover:#FF6A6E;
  --accent-ink:#1A0204; --accent-soft:#3A1719; --ok:#5CCB91; --ok-soft:#14301F; --warn:#E3A84A;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111317; --surface:#1A1D23; --sunken:#15181D; --ink:#ECEDF0; --muted:#A2A7B1;
  --line:#2D323B; --line-strong:#454B57; --accent:#FF4D52; --accent-hover:#FF6A6E;
  --accent-ink:#1A0204; --accent-soft:#3A1719; --ok:#5CCB91; --ok-soft:#14301F; --warn:#E3A84A;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}

/* App bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{height:38px;width:auto;background:#fff;border-radius:6px;padding:3px 6px;flex:none}
.bar-title{min-width:0;flex:1}
.bar-title h1{font-size:19px;line-height:1.1;letter-spacing:.01em}
.bar-title p{margin:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save-pill{flex:none;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.save-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.save-pill.pending .dot{background:var(--warn)}
.save-pill.err .dot{background:var(--accent)}
@media (max-width:520px){.save-pill .lbl{display:none}}
.chips{max-width:880px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;font-size:14px;font-weight:500;text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.chips a.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--accent-soft)}

/* Sections */
main{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:20px 140px;display:flex;flex-direction:column;gap:18px}
section.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);scroll-margin-top:130px}
.sec-h{display:flex;align-items:baseline;gap:10px;padding:16px 18px 6px}
.sec-h .n{font-family:var(--f-head);font-weight:700;color:var(--accent);font-size:15px;font-variant-numeric:tabular-nums}
.sec-h h2{font-size:21px;font-weight:700}
.sec-note{padding:0 18px;margin:0 0 4px;color:var(--muted);font-size:14px}
.rows{padding:4px 18px 16px}
.row{display:grid;grid-template-columns:1fr;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
@media (min-width:760px){.row{grid-template-columns:230px 1fr;gap:16px;align-items:start}.row>.lab{padding-top:11px}}
.lab{font-family:var(--f-head);font-weight:600;font-size:15px;letter-spacing:.01em;color:var(--ink)}
.lab small{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted);letter-spacing:0}
.ctl{min-width:0;display:flex;flex-direction:column;gap:8px}
.inp{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--sunken);font-size:16px}
.inp:focus{border-color:var(--accent);background:var(--surface);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
textarea.inp{min-height:110px;resize:vertical;line-height:1.45}
.suffix{display:flex;align-items:center;gap:8px}
.suffix span{color:var(--muted);font-size:15px}
.suffix .inp{max-width:200px}

/* Choice buttons */
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:8px 14px 8px 10px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--sunken);cursor:pointer;text-align:left;font-size:15.5px;line-height:1.25;max-width:100%}
.opt .box{flex:none;width:20px;height:20px;border:2px solid var(--line-strong);border-radius:5px;display:grid;place-items:center;background:var(--surface)}
.opt.one .box{border-radius:50%}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .box{border-color:var(--accent);background:var(--accent)}
.opt[aria-checked="true"] .box::after{content:"";width:10px;height:6px;border:2.5px solid var(--accent-ink);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.opt:hover{border-color:var(--accent)}
.extra{display:flex;flex-direction:column;gap:4px;padding-left:12px;border-left:3px solid var(--accent-soft)}
.extra label{font-size:13px;color:var(--muted)}

/* Apartments */
.apts{padding:4px 18px 16px;display:flex;flex-direction:column;gap:10px}
.apt-head,.apt{display:grid;grid-template-columns:28px minmax(0,1.3fr) minmax(0,.7fr) minmax(0,1.4fr) 40px;gap:8px;align-items:center}
.apt-head{font-size:13px;color:var(--muted);font-family:var(--f-head);font-weight:600}
.apt .no{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;text-align:right}
.apt .inp{min-height:42px;padding:8px 10px}
.icon-btn{width:40px;height:40px;border-radius:var(--r);border:1px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{color:var(--accent);border-color:var(--accent)}
@media (max-width:640px){
  .apt-head{display:none}
  .apt{grid-template-columns:1fr 1fr 40px;grid-template-areas:"no no del" "lage lage lage" "fl name name";padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunken)}
  .apt .no{grid-area:no;text-align:left;font-family:var(--f-head);font-weight:600}
  .apt .c-lage{grid-area:lage}.apt .c-fl{grid-area:fl}.apt .c-name{grid-area:name}.apt .icon-btn{grid-area:del}
}

/* Drawing */
.draw{padding:4px 18px 18px;display:flex;flex-direction:column;gap:10px}
.pad-wrap{position:relative;width:100%;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden;background:#fff}
.pad-wrap canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.pad-hint{position:absolute;inset:0;display:grid;place-items:center;color:#8A8F99;font-size:15px;pointer-events:none;text-align:center;padding:16px}
.pad-big{width:min(100%, calc((100dvh - 230px) * var(--ratio)));margin-inline:auto}
.pad-box{display:flex;flex-direction:column;gap:10px}
.pad-box.full{position:fixed;inset:0;z-index:45;background:var(--bg);padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px));justify-content:center;align-items:center}
.pad-box.full .pad-big{width:min(100%, calc((100dvh - 110px) * var(--ratio)))}
.pad-box.full .tools{justify-content:center}
.sk-list{display:flex;flex-direction:column;gap:22px}
.sk-item{display:flex;flex-direction:column;gap:10px}
.sk-item + .sk-item{border-top:1px solid var(--line);padding-top:20px}
.sk-head{display:flex;gap:10px;align-items:center}
.sk-no,.note-no{flex:none;font-family:var(--f-head);font-weight:700;font-size:16px}
.sk-head .inp{flex:1;min-width:0}
.add-btn{align-self:flex-start}
.notes{padding:4px 18px 18px;display:flex;flex-direction:column;gap:16px}
.note{display:flex;flex-direction:column;gap:6px}
.note-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pad-sign .baseline{position:absolute;left:6%;right:6%;bottom:22%;border-bottom:1.5px dashed #B9BEC8;pointer-events:none}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swatch{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);cursor:pointer;display:grid;place-items:center;background:var(--surface)}
.swatch i{width:20px;height:20px;border-radius:50%;display:block}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
.sep{width:1px;height:26px;background:var(--line);margin:0 4px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:600;font-size:15.5px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14.5px}
.btn[disabled]{opacity:.55;cursor:progress}
.btn svg,.icon-btn svg{width:20px;height:20px;flex:none}

/* Action bar */
.actions{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.actions-in{max-width:880px;margin:0 auto;display:flex;gap:10px;align-items:center}
.actions .grow{flex:1}
@media (max-width:520px){.actions .btn{padding:10px 12px}.actions .btn .t-long{display:none}}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media (min-width:640px){.scrim{align-items:center}}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:16px;padding:20px 20px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:14px;max-height:calc(100% - 24px);overflow:auto}
.sheet h3{font-size:22px}
.sheet p{margin:0;color:var(--muted)}
.sheet ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.addr{display:flex;gap:8px;align-items:center;padding:10px 12px;border:1px dashed var(--line-strong);border-radius:var(--r);background:var(--sunken)}
.addr code{flex:1;min-width:0;font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:15px;overflow-wrap:anywhere;user-select:all}
.sheet .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.file-name{font-size:14px;color:var(--muted);overflow-wrap:anywhere}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,6px)}}}
.foot{color:var(--muted);font-size:13px;text-align:center;padding-top:4px}
</style>

<header class="bar">
  <div class="bar-in">
    <img class="logo" id="logo" alt="EAD Digitaler Heizkostenabrechnungsdienst">
    <div class="bar-title">
      <h1>Aufnahmeprotokoll</h1>
      <p id="subtitle">Region Osnabrück-Westfalen GmbH</p>
    </div>
    <div class="save-pill" id="savePill" role="status" aria-live="polite"><span class="dot"></span><span class="lbl" id="saveLbl">Automatisch gespeichert</span><span id="saveTime"></span></div>
  </div>
  <nav class="chips" id="chips" aria-label="Abschnitte"></nav>
</header>

<main id="form"></main>

<div class="actions">
  <div class="actions-in">
    <button class="btn ghost" id="btnNew" type="button" title="Neues Protokoll beginnen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Neu</span></button>
    <span class="grow"></span>
    <button class="btn" id="btnSave" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg><span>PDF <span class="t-long">speichern</span></span></button>
    <button class="btn primary" id="btnSend" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg><span>Senden</span></button>
  </div>
</div>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="pdf-lib.min.js"></script>

/* ---------- Zustand + Autospeichern ---------- */
const today = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const blank = () => ({v:1, f:{datum:today()}, apts:[{},{},{}], sketches:[{t:"", s:[]}], notes:[""], sign:[]});
let S = blank();
let dirty = false, storageOk = true;

function load(){
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) { const d = JSON.parse(raw); if (d && d.v === 1) { if (d.sketch && !d.sketches) d.sketches = [{t:"", s:d.sketch}]; if (!d.notes) d.notes = [(d.f && d.f.bemerkungen) || ""]; delete d.sketch; S = Object.assign(blank(), d); } } }
  catch(e){ storageOk = false; }
}
function persist(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); storageOk = true; dirty = false; }
  catch(e){ storageOk = false; }
  showSaved();
}
function touch(){ dirty = true; const p = document.getElementById("savePill"); p.className = "save-pill pending"; document.getElementById("saveLbl").textContent = "Wird gespeichert…"; }
function showSaved(){
  const p = document.getElementById("savePill");
  if (!storageOk){ p.className = "save-pill err"; document.getElementById("saveLbl").textContent = "Speichern im Browser nicht möglich"; document.getElementById("saveTime").textContent = ""; return; }
  p.className = "save-pill";
  document.getElementById("saveLbl").textContent = "Automatisch gespeichert";
  document.getElementById("saveTime").textContent = new Date().toLocaleTimeString("de-DE");
}
setInterval(() => { if (dirty) persist(); }, 5000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && dirty) persist(); });
window.addEventListener("pagehide", () => { if (dirty) persist(); });

/* ---------- Rendering ---------- */
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {

  const logo = await doc.embedPng(b64ToBytes(LOGO.split(",")[1]));
  const PW = 595.28, PH = 841.89, M = 46, CW = PW - 2*M, LW = 168, VX = M + LW + 12, VW = PW - M - VX;

        while (font.widthOfTextAtSize(w, size) > maxW) { let k = w.length; while (k > 1 && font.widthOfTextAtSize(w.slice(0,k), size) > maxW) k--; if (line) { out.push(line); line = ""; } out.push(w.slice(0,k)); w = w.slice(k); }

    txt(title, M + 9, y, 12.5, B); y -= 10;

  let band = false;

    band = !band;
    let ly = y - PAD - SZ;
    labelLines.forEach(l => { txt(l, M + 6, ly, SZ, B, INK); ly -= LH; });
    hintLines.forEach(l => { txt(l, M + 6, ly + 1.5, 8, F, MUTED); ly -= 11; });
    drawValue(y - PAD);
    y -= h;
  };
  const fieldOut = f => {
    const labelLines = wrap(f.label, B, SZ, LW - 6), hintLines = f.hint ? wrap(f.hint, F, 8, LW - 6) : [];
    if (f.type === "one" || f.type === "many") {
      const sel = f.type === "one" ? (S.f[f.k] ? [S.f[f.k]] : []) : (S.f[f.k] || []);
      const items = [];
      let cx = 0, cy = 0;
      const BX = 8.5, GAP = 14;
      f.opts.forEach(o => {
        const t = optT(o), lines = wrap(t, B, SZ, VW - BX - 6), w = BX + 5 + Math.max(...lines.map(l => B.widthOfTextAtSize(l, SZ)));
        if (cx > 0 && (cx + w > VW || lines.length > 1)) { cx = 0; cy += LH + 4; }
        items.push({t, lines, x: cx, y: cy, on: sel.includes(t)});
        if (lines.length > 1) { cy += lines.length * LH + 4; cx = 0; } else cx += w + GAP;
      });
      const optH = cx > 0 ? cy + LH : cy - 4;
      let h = optH;
      const extras = [];
      f.opts.forEach((o, idx) => { if (typeof o === "object" && o.x && sel.includes(o.t)) { const v = (S.f[f.k + "__" + idx] || "").trim(); extras.push(wrap(o.x.replace(/\?$/, "") + ": " + (v || "–"), F, SZ, VW)); } });
      extras.forEach(e => h += 4 + e.length * LH);
      rowBlock(labelLines, hintLines, top => {
        items.forEach(it => {
          const bx = VX + it.x, by = top - it.y - SZ;
          page.drawRectangle({x: bx, y: by - 1, width: BX, height: BX, borderColor: it.on ? RED : MUTED, borderWidth: .9, color: it.on ? RED : undefined});
          if (it.on) { page.drawLine({start:{x:bx+1.8,y:by+3}, end:{x:bx+3.6,y:by+1.2}, thickness:1.3, color:rgb(1,1,1)}); page.drawLine({start:{x:bx+3.6,y:by+1.2}, end:{x:bx+6.9,y:by+5.8}, thickness:1.3, color:rgb(1,1,1)}); }
          it.lines.forEach((l, k) => txt(l, bx + BX + 5, by - k*LH, SZ, it.on ? B : F, it.on ? INK : MUTED));
        });
        let ey = top - optH - 4 - SZ;
        extras.forEach(e => { e.forEach(l => { txt(l, VX, ey, SZ, F, INK); ey -= LH; }); ey -= 4; });
      }, h);
    } else {
      let v = (S.f[f.k] || "").trim();
      if (f.type === "date") v = fmtDate(v);
      if (v && f.suffix) v += " " + f.suffix;
      const lines = v ? wrap(v, F, 10, VW) : ["–"];
      rowBlock(labelLines, hintLines, top => { lines.forEach((l, k) => txt(l, VX, top - 10 - k*LH, 10, F, v ? INK : MUTED)); }, lines.length * LH);
    }
  };

  for (const s of SCHEMA) {
    if (s.id === "aufnahme") { secHead("Kunde"); band = false; fieldOut(s.fields[2]); continue; }
    if (s.kind === "draw" || s.kind === "sketches") continue;
    if (s.kind === "apts") {
      secHead("Wohnungsübersicht"); band = false;
      const rows = S.apts.filter(a => ((a.lage||"") + (a.flaeche||"") + (a.name||"")).trim());
      const cols = [{k:"#", w:24}, {k:"lage", t:"Whg.-Nr. und/oder Lage", w:CW*.38}, {k:"flaeche", t:"Wohnfläche in m²", w:CW*.18}, {k:"name", t:"Vor- und Zuname Bewohner", w:0}];
      cols[3].w = CW - cols[0].w - cols[1].w - cols[2].w;
      const header = () => { need(24); let x = M; y -= 4; cols.forEach(c => { if (c.t) txt(c.t, x + 6, y - SZ - 2, 8.5, B, MUTED); x += c.w; }); y -= 18; page.drawLine({start:{x:M,y}, end:{x:PW-M,y}, thickness:.6, color:LINE}); };
      if (!rows.length) { y -= 6; txt("Keine Wohnungen eingetragen.", M + 6, y - 10, 10, F, MUTED); y -= 18; }
      else {
        header();
        rows.forEach((a, i) => {
          const cells = cols.map(c => c.k === "#" ? [String(i+1)] : wrap((a[c.k] || "").trim() || "–", F, 10, c.w - 12));
          const h = Math.max(...cells.map(c => c.length)) * LH + 10;
          if (need(h)) { header(); band = false; }
          if (band) page.drawRectangle({x:M, y:y-h, width:CW, height:h, color:BAND});
          band = !band;
          let x = M;
          cols.forEach((c, ci) => { cells[ci].forEach((l, k) => txt(l, x + 6, y - 5 - 9 - k*LH, c.k === "#" ? 9 : 10, F, c.k === "#" ? MUTED : INK)); x += c.w; });
          y -= h;
        });
      }
      continue;
    }
    if (s.id === "bemerkungen") {
      secHead("Bemerkungen");
      const notes = S.notes.map((n, i) => ({n: (n || "").trim(), i})).filter(x => x.n);
      y -= 6;
      if (!notes.length) { need(LH); txt("Keine Bemerkungen.", M + 6, y - 10, 10, F, MUTED); y -= LH + 1; }
      notes.forEach((x, k) => {
        if (S.notes.length > 1) { need(LH * 2 + 6); if (k) y -= 6; txt("Bemerkung " + (x.i + 1), M + 6, y - 10, 10, B, INK); y -= LH + 3; }
        wrap(x.n, F, 10, CW - 12).forEach(l => { need(LH); txt(l, M + 6, y - 10, 10, F, INK); y -= LH + 1; });
      });
      continue;
    }
    secHead(s.title); band = false;
    const fs = s.fields;
    if (s.note) { need(16); txt(s.note, M + 6, y - 14, 9, F, MUTED); y -= 20; }
    fs.forEach(fieldOut);
  }

  // Skizze
  {
    const sec = SCHEMA.find(s => s.kind === "sketches");
    const used = S.sketches.map((sk, i) => ({sk, i})).filter(x => x.sk.s.length);
    for (const x of used) {
      const maxH = PH - 2*M - 24 - 60;
      let h = Math.min(CW / sec.ratio, maxH), w = h * sec.ratio;
      if (y - 60 - h < M + 24) newPage();
      secHead("Skizze " + (x.i + 1) + (x.sk.t && x.sk.t.trim() ? " – " + x.sk.t.trim() : "")); y -= 8;
      const img = await doc.embedPng(await strokesPng(x.sk.s, sec.ratio));
      const ix = M + (CW - w) / 2;
      page.drawImage(img, {x:ix, y:y-h, width:w, height:h});
      page.drawRectangle({x:ix, y:y-h, width:w, height:h, borderColor:LINE, borderWidth:.8});
      y -= h + 6;
    }
  }
  // Unterschrift
  {
    const sec = SCHEMA.find(s => s.dk === "sign");
    const w = 250, h = w / sec.ratio;
    if (y - 50 - h - 30 < M + 24) newPage();
    secHead("Unterschrift"); y -= 10;
    if (S.sign.length) { const img = await doc.embedPng(await strokesPng(S.sign, sec.ratio, true)); page.drawImage(img, {x:M, y:y-h, width:w, height:h}); }
    y -= h;
    page.drawLine({start:{x:M, y}, end:{x:M+w, y}, thickness:.8, color:INK});
    y -= 12;
    txt([S.f.sign_name, fmtDate(S.f.datum)].filter(Boolean).join(", ") || "Name, Datum", M, y, 9, F, MUTED);
  }

  // Fußzeile
  const pages = doc.getPages(), foot = ["Aufnahmeprotokoll", [S.f.l_adresse, S.f.l_stadt].filter(Boolean).join(", ")].filter(Boolean).join("  ·  ");
  pages.forEach((p, i) => {
    p.drawLine({start:{x:M, y:M - 4}, end:{x:PW-M, y:M - 4}, thickness:.5, color:LINE});
    p.drawText(clean(foot), {x:M, y:M - 16, size:8, font:F, color:MUTED});
    const pn = "Seite " + (i+1) + " von " + pages.length;
    p.drawText(pn, {x: PW - M - F.widthOfTextAtSize(pn, 8), y: M - 16, size:8, font:F, color:MUTED});
  });
  const bytes = await doc.save();
  return new File([bytes], fileName(), {type:"application/pdf"});
}

/* ---------- Speichern + Senden ---------- */
let downloadsCap = null;
if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("downloads").then(d => { downloadsCap = d; }).catch(() => {});
}
function busy(btn, on){ btn.disabled = on; }
async function saveFile(file){
  if (downloadsCap) {
    try { await downloadsCap.save({filename: file.name, data: file}); toast("PDF gespeichert: " + file.name); return true; }
    catch(e){ if (e && e.code === "declined") return false; }
  }
  try {
    const url = URL.createObjectURL(file);
    const a = el("a", {href:url, download:file.name, style:"display:none"}); document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    toast("PDF gespeichert: " + file.name);
    return true;
  } catch(e){ toast("Die PDF konnte nicht gespeichert werden."); return false; }
}
async function makeFile(btn){
  persist(); busy(btn, true);
  try { return await buildPdf(); }
  catch(e){ console.error(e); toast("PDF konnte nicht erstellt werden: " + e.message); return null; }
  finally { busy(btn, false); }
}
document.getElementById("btnSave").addEventListener("click", async e => { const f = await makeFile(e.currentTarget); if (f) saveFile(f); });

document.getElementById("btnSend").addEventListener("click", async e => {
  const file = await makeFile(e.currentTarget); if (!file) return;
  const canShare = !!(navigator.canShare && navigator.share && (() => { try { return navigator.canShare({files:[file]}); } catch(_){ return false; } })());
  const name = el("p", {class:"file-name", text:"Datei: " + file.name});
  if (canShare) {
    const go = el("button", {type:"button", class:"btn primary", text:"Mail-App wählen"});
    go.addEventListener("click", async () => {
      try {
        await navigator.share({files:[file], title:"Aufnahmeprotokoll", text:"Aufnahmeprotokoll im Anhang. Bitte senden an " + MAIL});
        closeSheet(); toast("Übergeben. Bitte die E-Mail in der Mail-App absenden.");
      } catch(err){ if (err && err.name === "AbortError") return; fallback(file); }
    });
    openSheet(el("h3", {text:"Protokoll senden"}),
      el("ol", {}, el("li", {text:"Auf „Mail-App wählen“ tippen und z. B. Gmail oder Outlook auswählen. Die PDF ist schon angehängt."}),
        el("li", {text:"Als Empfänger diese Adresse eintragen:"})),
      addrBox(),
      el("ol", {start:"3"}, el("li", {text:"E-Mail absenden."})),
      name,
      el("div", {class:"btns"}, el("button", {type:"button", class:"btn ghost", text:"Abbrechen", onclick: closeSheet}), go));
  } else fallback(file);
});
function fallback(file){
  const save = el("button", {type:"button", class:"btn", text:"1. PDF speichern"});
  save.addEventListener("click", () => saveFile(file));
  const mail = el("a", {class:"btn primary", href:"mailto:" + MAIL + "?subject=" + encodeURIComponent("Aufnahmeprotokoll " + file.name.replace(/\.pdf$/,"")), text:"2. E-Mail öffnen", style:"text-decoration:none"});
  openSheet(el("h3", {text:"Protokoll senden"}),
    el("p", {text:"Dieser Browser kann die PDF nicht direkt an eine Mail-App übergeben. So geht es trotzdem:"}),
    el("ol", {}, el("li", {text:"PDF speichern."}), el("li", {text:"Eine neue E-Mail an diese Adresse schreiben:"})), addrBox(),
    el("ol", {start:"3"}, el("li", {text:"Die gespeicherte PDF aus dem Download-Ordner anhängen und absenden."})),
    el("p", {class:"file-name", text:"Datei: " + file.name}),
    el("div", {class:"btns"}, el("button", {type:"button", class:"btn ghost", text:"Schließen", onclick: closeSheet}), save, mail));
}

document.getElementById("btnNew").addEventListener("click", () => {
  confirmSheet("Neues Protokoll beginnen?", "Alle Eingaben dieses Protokolls werden gelöscht. Speichern oder senden Sie vorher die PDF.", "Neues Protokoll", () => {
    try { localStorage.setItem(STORE_KEY + "-vorher", JSON.stringify(S)); } catch(e){}
    const keepName = S.f.mitarbeiter;
    S = blank(); if (keepName) S.f.mitarbeiter = keepName;
    render(); persist(); window.scrollTo({top:0}); toast("Neues Protokoll begonnen.");
  });
});

document.getElementById("logo").src = LOGO;
load(); render(); showSaved();
